<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookahead</title>
<link rel="stylesheet" href="/lookahead/static/base.css">
<link rel="stylesheet" href="/lookahead/static/timeline.css">
<link rel="stylesheet" href="/lookahead/static/drawer.css">
<link rel="stylesheet" href="/lookahead/static/decision.css">
<link rel="stylesheet" href="/lookahead/static/lists.css">
<link rel="stylesheet" href="/lookahead/static/overview.css">
<link rel="stylesheet" href="/lookahead/static/chrome.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>Lookahead</b><span class="launch" id="launch-name"></span></div>
    <div class="goal empty" id="goal"></div>
    <div class="clockbox" id="clock"></div>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="main">
    <div class="stage" id="stage"></div>
    <aside class="drawer" id="drawer" hidden></aside>
    <div class="overlay" id="overlay" hidden></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="operator" class="operator" hidden></div>
<div id="toast-root"></div>

<script src="/lookahead/static/core.js"></script>
<script src="/lookahead/static/header.js"></script>
<script src="/lookahead/static/timeline.js"></script>
<script src="/lookahead/static/timeline_bars.js"></script>
<script src="/lookahead/static/overview.js"></script>
<script src="/lookahead/static/weak.js"></script>
<script src="/lookahead/static/promises.js"></script>
<script src="/lookahead/static/suppliers.js"></script>
<script src="/lookahead/static/decisions.js"></script>
<script src="/lookahead/static/drawer.js"></script>
<script src="/lookahead/static/decision_card.js"></script>
<script src="/lookahead/static/goal.js"></script>
<script src="/lookahead/static/operator.js"></script>
<script src="/lookahead/static/main.js"></script>
</body>
</html>
