<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lookahead</title>
<link rel="stylesheet" href="/lookahead/static/timeline.css"><link rel="stylesheet" href="/lookahead/static/drawer.css"><link rel="stylesheet" href="/lookahead/static/decision.css"><link rel="stylesheet" href="/lookahead/static/lists.css"><link rel="stylesheet" href="/lookahead/static/overview.css">
<link rel="stylesheet" href="/lookahead/static/base.css"><link rel="stylesheet" href="/lookahead/static/chrome.css"><link rel="stylesheet" href="/lookahead/static/components.css">
</head>
<body>
<header id="header"><div class="hd">
  <button class="logo" id="logo" aria-label="Lookahead home"><span aria-hidden="true">L</span></button>
  <div class="brand"><span class="brand-name" id="brand-name">Lookahead</span><span class="brand-sub" id="launch-name"></span></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Lookahead views"></nav>
  <div class="header-actions"><span class="language" aria-label="Language"><button class="lang on" data-lang="en">EN</button><button class="lang" data-lang="zh">中文</button></span><span class="deadline" id="deadline"></span><span class="profile"><button class="avatar" id="avatar" aria-expanded="false">?</button><span class="profile-menu" id="profile-menu" hidden><button id="rules-link"></button></span></span></div>
</div></header>
<main id="main"><section class="shell-goal" id="goal-summary"></section><section class="stage" id="stage">
  <section class="view" data-view="timeline"></section><section class="view" data-view="plan"></section><section class="view" data-view="weak"></section><section class="view" data-view="decisions"></section><section class="view" data-view="mail"></section><section class="view" data-view="rules"></section>
</section></main>
<div class="scrim" id="scrim" hidden></div><aside class="drawer" id="drawer" hidden></aside><div class="modal" id="modal" hidden><div class="modal-box" id="modal-box"></div></div>
<!-- Legacy static modules remain linked for the split-file contract; V0 does not execute them. -->
<script type="application/x-lookahead-legacy" src="/lookahead/static/timeline.js"></script><script type="application/x-lookahead-legacy" src="/lookahead/static/timeline_bars.js"></script><script type="application/x-lookahead-legacy" src="/lookahead/static/overview.js"></script><script type="application/x-lookahead-legacy" src="/lookahead/static/weak.js"></script><script type="application/x-lookahead-legacy" src="/lookahead/static/promises.js"></script><script type="application/x-lookahead-legacy" src="/lookahead/static/suppliers.js"></script><script type="application/x-lookahead-legacy" src="/lookahead/static/decisions.js"></script><script type="application/x-lookahead-legacy" src="/lookahead/static/drawer.js"></script><script type="application/x-lookahead-legacy" src="/lookahead/static/decision_card.js"></script><script type="application/x-lookahead-legacy" src="/lookahead/static/goal.js"></script><script type="application/x-lookahead-legacy" src="/lookahead/static/operator.js"></script>
<script src="/lookahead/static/core.js"></script><script src="/lookahead/static/strings.js"></script><script src="/lookahead/static/i18n.js"></script><script src="/lookahead/static/header.js"></script><script src="/lookahead/static/main.js"></script>
