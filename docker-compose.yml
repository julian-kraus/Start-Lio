services:
  db:
    image: postgres:17-alpine
    env_file: secrets/db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tracker:
    build: .
    env_file:
      - .env
      - secrets/db.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TRACKER_DATA_DIR: /data
      STALE_RULES: ${STALE_RULES:-soony/erp/open_shipments.*=6h,soony/logistics/*=12h}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  kb:
    build: .
    command: ["python", "-m", "kb", "run"]
    env_file:
      - .env
      - secrets/db.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TRACKER_DATA_DIR: /data
      MAIL_DATA_DIR: /mail_data
      KB_LLM_ADAPTER: ${KB_LLM_ADAPTER:-}
    volumes:
      - ./data:/data:ro
      - ./mail_data:/mail_data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mail:
    build: .
    command: ["python", "-m", "mail", "run"]
    env_file:
      - .env
      - secrets/db.env
      - secrets/mail.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TRACKER_DATA_DIR: /data
      MAIL_DATA_DIR: /mail_data
    volumes:
      - ./data:/data:ro
      - ./mail_data:/mail_data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    command: ["python", "-m", "tracker.web"]
    env_file: secrets/db.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TRACKER_DATA_DIR: /data
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8787"
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
