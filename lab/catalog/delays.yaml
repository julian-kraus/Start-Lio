family: delays
# Delays and new ETAs: a confirmed line slips, an ETA becomes unknown, or a slipped line recovers.
types:
  - id: delays.new_eta
    description: Supplier announces a later arrival date for a confirmed order line.
    channel: mail
    parameters:
      supplier: {type: ref, ref: supplier}
      line: {type: ref, ref: order_line}
      new_eta: {type: date}
      reason: {type: text, required: false}
    produces:
      mail:
        persona: "{supplier.persona}"
        subject:
          en: "Updated delivery date for order {line.po_number}"
          de: "Neuer Liefertermin fuer Bestellung {line.po_number}"
        body:
          en: "Dear team,\n\nLine {line.po_line} on order {line.po_number} will now arrive on {new_eta}. Reason: {reason}.\n\nKind regards"
          de: "Sehr geehrtes Team,\n\nPosition {line.po_line} der Bestellung {line.po_number} trifft nun am {new_eta} ein. Grund: {reason}.\n\nMit freundlichen Gruessen"
    expects:
      - {fact_type: confirmed_date, attribute: eta, change: update}

  - id: delays.eta_unknown
    description: Supplier can no longer give an arrival date for a confirmed line.
    channel: mail
    parameters:
      supplier: {type: ref, ref: supplier}
      line: {type: ref, ref: order_line}
      reason: {type: text, required: false}
    produces:
      mail:
        persona: "{supplier.persona}"
        subject: "Delivery date under review for order {line.po_number}"
        body:
          en: "Dear team,\n\nWe cannot confirm an arrival date for line {line.po_line} on order {line.po_number} yet. Reason: {reason}. We will follow up.\n\nKind regards"
    expects:
      - {fact_type: confirmed_date, attribute: eta, change: deactivate}

  - id: delays.recovery
    description: A previously slipped line recovers to an earlier arrival date.
    channel: mail
    parameters:
      supplier: {type: ref, ref: supplier}
      line: {type: ref, ref: order_line}
      new_eta: {type: date}
    produces:
      mail:
        persona: "{supplier.persona}"
        subject: "Earlier delivery possible for order {line.po_number}"
        body:
          en: "Dear team,\n\nGood news: line {line.po_line} on order {line.po_number} can now arrive by {new_eta}.\n\nKind regards"
    expects:
      - {fact_type: confirmed_date, attribute: eta, change: update}
